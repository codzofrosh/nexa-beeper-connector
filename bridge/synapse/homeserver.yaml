# Synapse Matrix homeserver configuration for Nexa
# Generated by bridge/auth/setup.py — do not edit manually.

server_name: "localhost"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

log_config: /config/logging.yaml
media_store_path: /data/media_store

# Open registration (no captcha) — this is a local, private homeserver
enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: "7460ad98dfb7dbb5ea42a8473fb30b01572643fa918fb1293398cf4472ddcd0d"

report_stats: false
macaroon_secret_key: "df4c75b18a2d7530e1112e713045a5ad7aae22f37075e2100e2bf4f71050477a"
form_secret: "5068d1d6dc6b466b3fb8f28abc9e68a7faccf0f43286c802f54be16ddc1934f7"
signing_key_path: /data/localhost.signing.key

# No federation — local bridge only
federation_domain_whitelist: []
trusted_key_servers: []
suppress_key_server_warning: true

app_service_config_files:
  - /config/whatsapp-registration.yaml
  - /config/linkedin-registration.yaml
  - /config/instagram-registration.yaml
  - /config/twitter-registration.yaml
